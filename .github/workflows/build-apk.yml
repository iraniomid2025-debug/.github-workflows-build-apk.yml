name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f "option-assistant-app.zip" ]; then
            unzip -o option-assistant-app.zip
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: option-assistant-app
        run: npm install

      - name: Add Android platform
        working-directory: option-assistant-app
        run: npx cap add android || true

      - name: Sync Capacitor
        working-directory: option-assistant-app
        run: npx cap sync android

      - name: Force-set app icon (guaranteed)
        working-directory: option-assistant-app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y imagemagick
          SRC="resources/icon.png"
          RES="android/app/src/main/res"
          declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!SIZES[@]}"; do
            size=${SIZES[$density]}
            dir="$RES/mipmap-$density"
            mkdir -p "$dir"
            convert "$SRC" -resize ${size}x${size} "$dir/ic_launcher.png"
            convert "$SRC" -resize ${size}x${size} "$dir/ic_launcher_round.png"
          done
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Grant execute permission
        working-directory: option-assistant-app
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: option-assistant-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: option-assistant-app-debug-apk
          path: option-assistant-app/android/app/build/outputs/apk/debug/app-debug.apk
